<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="YARD Burguer">
  <!--
    Favicon derivado da logo real: pão com duas palmeiras dentro.

    A logo original tem o pão em bege sobre creme e o texto "YARD BURGUER"
    embaixo. Aqui o texto sai — em 16px ele vira borrão — e fica só a marca
    gráfica, que é o que precisa ser reconhecível na aba.

    Cores dos tokens da marca: carvão de fundo, areia no pão, terracota nas
    palmeiras. Sem o vermelho fogo, que é cor exclusiva de CTA.
  -->
  <rect width="64" height="64" rx="14" fill="#140C06" />

  <!-- Tampa do pão -->
  <path d="M14 30c0-9.4 8.1-17 18-17s18 7.6 18 17z" fill="#E8DCC8" />

  <!-- Recheio: a faixa escura que separa as duas metades -->
  <rect x="13" y="32" width="38" height="5" rx="2.5" fill="#8B4A2B" />

  <!-- Base do pão -->
  <path d="M50 39c0 5-8.1 9-18 9s-18-4-18-9z" fill="#E8DCC8" />

  <!-- Palmeiras dentro da tampa. Duas, como na logo: tronco curvo e copa
       em leque. Formas grossas de propósito para sobreviver a 16px. -->
  <g fill="#8B4A2B">
    <path d="M25 29c0-3.5.6-6.4 1.7-8.6l1.9.7c-.9 2-1.4 4.6-1.4 7.9z" />
    <path d="M27.6 19.4c-2.6-1.7-5.3-1.5-7.3.4 2.4-.6 4.5-.3 6.2.9zM27.6 19.4c2.9-1 5.4-.1 6.8 2.2-2-1.3-4.2-1.6-6.3-.8z" />
    <path d="M37 29c0-3.5.6-6.4 1.7-8.6l1.9.7c-.9 2-1.4 4.6-1.4 7.9z" />
    <path d="M39.6 19.4c-2.6-1.7-5.3-1.5-7.3.4 2.4-.6 4.5-.3 6.2.9zM39.6 19.4c2.9-1 5.4-.1 6.8 2.2-2-1.3-4.2-1.6-6.3-.8z" />
  </g>
</svg>
