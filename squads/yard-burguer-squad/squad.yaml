name: yard-burguer-squad
version: 1.0.0
description: >-
  Squad de landing page cinematografica para a YARD Burguer (Rio Verde-GO). Vende desejo por scrollytelling e entrega o
  clique no cardapio Brendi.
author: GabrielBotelhoeng
license: UNLICENSED
slashPrefix: yard
aiox:
  minVersion: 2.1.0
  type: squad
components:
  tasks:
    - define-brand-tokens.md
    - produce-ingredient-layers.md
    - harvest-instagram-assets.md
    - optimize-image-pipeline.md
    - design-scroll-choreography.md
    - implement-explode-scene.md
    - implement-parallax-layers.md
    - audit-motion-fallbacks.md
    - tune-pin-timeline.md
    - debug-scroll-trigger.md
    - document-scroll-triggers.md
    - write-section-copy.md
    - craft-cta-ladder.md
    - set-performance-budget.md
    - audit-mobile-experience.md
    - audit-accessibility.md
    - implement-local-seo.md
    - setup-conversion-tracking.md
    - build-owner-pitch.md
  agents:
    - brand-art-director.md
    - motion-director.md
    - scroll-trigger-specialist.md
    - hunger-copywriter.md
    - mobile-performance-guardian.md
    - local-growth-engineer.md
    - deal-closer.md
  workflows:
    - landing-build-flow.yaml
  checklists:
    - launch-readiness.md
  templates: []
  tools: []
  scripts:
    - gemini-image.mjs
config:
  extends: extend
  coding-standards: config/coding-standards.md
  tech-stack: config/tech-stack.md
  source-tree: config/source-tree.md
dependencies:
  node: []
  python: []
  squads: []

# Conhecimento de dominio consumido pelos agentes deste squad
data:
  brand: data/brand-sertao-premium.md
  storyboard: data/scroll-storyboard.md
  business: data/business-context.md
  skills: data/skill-map.md

integration:
  menu_url: https://menu.brendi.com.br/yard-burguer
  instagram: https://www.instagram.com/yardburguer_rioverde/
  city: Rio Verde-GO
  image_generation:
    primary:
      provider: gemini
      env_key: GEMINI_API_KEY
      status: BLOQUEADO
      models:
        hero: gemini-3-pro-image      # nano banana pro
        batch: gemini-3.1-flash-image
      blocker: >-
        Chave valida e autenticada, mas free tier com quota 0 para modelos de imagem
        (429 RESOURCE_EXHAUSTED). Texto funciona via gemini-flash-latest. Para
        destravar: habilitar billing no projeto Google Cloud da chave.
      verified_at: "2026-08-24"
    fallback:
      provider: higgsfield
      status: DISPONIVEL
      note: MCP ja conectado nesta sessao — caminho ativo enquanto o Gemini nao tem billing
    note: chave vive em .env na raiz do projeto, nunca no repositorio

tags:
  - landing-page
  - scrollytelling
  - parallax
  - food
  - conversao-local
blueprint:
  source:
    - ./referencia/Prompt Base.txt
    - ./referencia/para oque vai servir.txt
    - ./referencia/referecnia parallax.txt
    - ./referencia/lOGO HAMBURGUERIA.jpg
    - ./referencia/HOME.jpeg
    - ./referencia/referencia 1 .jfif
    - ./referencia/referencia 2.jfif
    - ./referencia/referencia 3.jfif
    - ./referencia/referencia para rolaghem paralax com hamburguer.jfif
  created_at: "2026-08-24T00:00:00Z"
  confidence: 0.89
